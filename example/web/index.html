<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="marker_crafter_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>marker_crafter_example</title>
  <link rel="manifest" href="manifest.json">
  <!-- Optional, git-ignored: sets window.MAPS_API_KEY (see README.md). -->
  <script src="maps_api_key.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Starts Flutter once the Maps JavaScript API is loaded, so the map can be
    // created right away. Without a key Flutter starts anyway.
    function addScript(src, onDone) {
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      if (onDone) {
        script.onload = onDone;
        script.onerror = onDone;
      }
      document.head.appendChild(script);
    }
    function startFlutter() {
      addScript('flutter_bootstrap.js');
    }
    if (window.MAPS_API_KEY) {
      addScript('https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(window.MAPS_API_KEY), startFlutter);
    } else {
      startFlutter();
    }
  </script>
</body>
</html>
